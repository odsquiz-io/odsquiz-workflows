name: Manage Billable Terraform Infrastructure

on:
  workflow_call:
    inputs:
      action:
        description: "Lifecycle action: start or stop."
        required: true
        type: string
      project_id:
        description: "Google Cloud project that contains the Terraform state and resources."
        required: true
        type: string
      workload_identity_provider:
        description: "Workload Identity Provider resource name used for GitHub OIDC."
        required: true
        type: string
      service_account:
        description: "Google service account to impersonate."
        required: true
        type: string
      cloudflare_token_secret:
        description: "Secret Manager secret that contains the Cloudflare Terraform API token."
        required: false
        default: "CLOUDFLARE_TERRAFORM_TOKEN"
        type: string
      terraform_version:
        description: "Terraform CLI version."
        required: false
        default: "1.11.4"
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-billable-infrastructure-${{ inputs.project_id }}
  cancel-in-progress: false

jobs:
  manage:
    name: ${{ inputs.action }} billable infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Validate requested action
        env:
          ACTION: ${{ inputs.action }}
        run: |
          set -euo pipefail
          case "$ACTION" in
            start) ;;
            stop) ;;
            *)
              echo "action must be start or stop." >&2
              exit 1
              ;;
          esac

      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ inputs.terraform_version }}
          terraform_wrapper: false

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ inputs.workload_identity_provider }}
          service_account: ${{ inputs.service_account }}

      - name: Retrieve Cloudflare token from Secret Manager
        env:
          PROJECT_ID: ${{ inputs.project_id }}
          SECRET_NAME: ${{ inputs.cloudflare_token_secret }}
        run: |
          set -euo pipefail
          token="$(gcloud secrets versions access latest --project="$PROJECT_ID" --secret="$SECRET_NAME")"
          echo "::add-mask::$token"
          echo "CLOUDFLARE_API_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Initialize and validate Terraform
        run: |
          set -euo pipefail
          terraform init -input=false
          terraform validate

      - name: Read infrastructure settings
        id: settings
        run: |
          set -euo pipefail
          {
            echo "instance=$(terraform output -raw database_instance_name)"
            echo "database=$(terraform output -raw database_name)"
            echo "exports_bucket=$(terraform output -raw db_exports_bucket_name)"
            echo "db_user_secret=$(terraform output -raw database_user_secret)"
          } >> "$GITHUB_OUTPUT"

      - name: Create database
        if: inputs.action == 'start'
        run: |
          set -euo pipefail
          terraform plan -input=false -out=tfplan \
            -target=google_sql_database_instance.main \
            -target=google_sql_database.app \
            -target=google_sql_user.app \
            -target=google_storage_bucket_iam_member.sql_db_exports_object_admin
          terraform apply -input=false -auto-approve tfplan

      - name: Import latest database export
        if: inputs.action == 'start'
        env:
          PROJECT_ID: ${{ inputs.project_id }}
          INSTANCE: ${{ steps.settings.outputs.instance }}
          DATABASE: ${{ steps.settings.outputs.database }}
          EXPORTS_BUCKET: ${{ steps.settings.outputs.exports_bucket }}
          DB_USER_SECRET: ${{ steps.settings.outputs.db_user_secret }}
        run: |
          set -euo pipefail
          export_uri="gs://${EXPORTS_BUCKET}/${DATABASE}.sql.gz"
          if ! gcloud storage objects describe "$export_uri" --project="$PROJECT_ID" >/dev/null 2>&1; then
            echo "No database export found; starting with an empty database."
            exit 0
          fi
          db_user="$(gcloud secrets versions access latest --project="$PROJECT_ID" --secret="$DB_USER_SECRET")"
          echo "::add-mask::$db_user"
          # The bucket grant for the new instance can take a moment to propagate.
          for attempt in 1 2 3 4; do
            if gcloud sql import sql "$INSTANCE" "$export_uri" \
              --project="$PROJECT_ID" --database="$DATABASE" --user="$db_user" --quiet; then
              exit 0
            fi
            echo "Import attempt $attempt failed; retrying." >&2
            sleep 30
          done
          exit 1

      - name: Create services
        if: inputs.action == 'start'
        run: |
          set -euo pipefail
          terraform plan -input=false -out=tfplan \
            -target=google_cloud_run_v2_service.auth \
            -target=google_cloud_run_v2_service.initiatives \
            -target=google_cloud_run_v2_service.quiz \
            -target=google_cloud_run_v2_service.admin \
            -target=google_cloud_run_v2_service.frontend
          terraform apply -input=false -auto-approve tfplan

      - name: Export database
        if: inputs.action == 'stop'
        env:
          PROJECT_ID: ${{ inputs.project_id }}
          INSTANCE: ${{ steps.settings.outputs.instance }}
          DATABASE: ${{ steps.settings.outputs.database }}
          EXPORTS_BUCKET: ${{ steps.settings.outputs.exports_bucket }}
        run: |
          set -euo pipefail
          if ! gcloud sql instances describe "$INSTANCE" --project="$PROJECT_ID" >/dev/null 2>&1; then
            echo "Cloud SQL instance not found; nothing to export."
            exit 0
          fi
          gcloud sql export sql "$INSTANCE" "gs://${EXPORTS_BUCKET}/${DATABASE}.sql.gz" \
            --project="$PROJECT_ID" --database="$DATABASE" --quiet

      - name: Destroy billable resources
        if: inputs.action == 'stop'
        run: |
          set -euo pipefail
          terraform plan -destroy -input=false -out=tfplan \
            -target=google_cloud_run_v2_service.auth \
            -target=google_cloud_run_v2_service.initiatives \
            -target=google_cloud_run_v2_service.quiz \
            -target=google_cloud_run_v2_service.admin \
            -target=google_cloud_run_v2_service.frontend \
            -target=google_storage_bucket_iam_member.sql_db_exports_object_admin \
            -target=google_sql_user.app \
            -target=google_sql_database.app \
            -target=google_sql_database_instance.main
          terraform apply -input=false -auto-approve tfplan
